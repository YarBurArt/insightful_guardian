[tool.poetry]
name = "insightful-guardian"
version = "0.1.0"
description = ""
authors = ["YarBurArt <81087967+YarBurArt@users.noreply.github.com>"]
readme = "README.md"
package-mode = false 

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
faker = "^25.2.0"
pandas = "^2.2.2"
better-profanity = "^0.7.0"
transformers = "^5.0.0rc3"
#torch = "^2.3.0"
bandit = "^1.7.8"
g4f = "^0.3.1.9"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.27"
rapidfuzz = "^3.9.3"
#asyncpg = "^0.29.0"
python-dotenv = "^1.0.1"
curl-cffi = "^0.7.3"
pygments = "2.20.0"
aiosqlite = "^0.21.0"
sqlalchemy = {version = "^2.0.40", extras = ["asyncio"]}
alembic = "^1.15.2"
asyncpg = "^0.30.0"
pytest = ">=8.4.1,<10.0.0"
motor = "^3.7.1"
pymongo = "^4.15.5"
uvicorn = "^0.38.0"
ruff = "^0.17.0"
litestar = {extras = ["standard"], version = "^2.25.0"}


[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend"]


[tool.ruff]
target-version = "py313"
# same paths excluded in the old pylint workflow (backend only)
extend-exclude = [
    "frontend",
    "backend/alembic",
    "backend/app/tests",
    "backend/app/schemas",
    "backend/migration",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]  # enable SAST like checks
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = ["S101", "S311"]  # asserts and fuzzing RNG are expected in tests


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
